<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucia Aylas — PORTFOLIO AUDIOVISUAL</title>
    <style>
        :root {
            --bg-main: #09090b;
            --bg-card: #141416;
            --accent: #bc3bf7;
            --accent-glow: rgba(188, 59, 247, 0.3);
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --border: #27272a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            overflow-x: hidden;
            padding: 0 24px;
        }

        /* Navbar */
        header {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand h1 {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .brand span {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        .nav-center {
            display: flex;
            gap: 8px;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            padding: 4px;
            border-radius: 30px;
        }

        .nav-link {
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.9rem;
            padding: 8px 16px;
            border-radius: 20px;
            transition: background-color 0.2s;
        }

        .nav-link:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .email-top {
            font-size: 0.9rem;
            color: var(--text-main);
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            padding: 6px 16px;
            border-radius: 20px;
            text-decoration: none;
        }

        .lang-switch {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2px;
            display: flex;
            gap: 2px;
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 6px 10px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .lang-btn.active {
            background-color: var(--accent);
            color: var(--text-main);
        }

        /* Hero Section */
        .hero {
            max-width: 1200px;
            margin: 80px auto 120px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 40px;
        }

        .hero-left {
            max-width: 580px;
        }

        .hero-tag {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent);
            margin-bottom: 16px;
            font-weight: 600;
        }

        .hero h2 {
            font-size: 4.8rem;
            font-weight: 800;
            letter-spacing: -2px;
            line-height: 1.05;
            margin-bottom: 24px;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.1rem;
            line-height: 1.5;
            margin-bottom: 32px;
        }

        .hero-buttons {
            display: flex;
            gap: 12px;
        }

        .btn-primary {
            background-color: var(--accent);
            color: var(--text-main);
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 4px 20px var(--accent-glow);
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            background-color: #cd55ff;
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border);
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background-color 0.2s;
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        /* Hero Right: Showcase Slider Placeholder */
        .hero-right-showcase {
            flex-grow: 1;
            max-width: 580px;
            height: 340px;
            border-radius: 24px;
            background: linear-gradient(135deg, #180828 0%, #0c0414 100%);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: inset 0 0 40px rgba(188, 59, 247, 0.1);
        }

        .hero-right-showcase::before {
            content: "✦";
            font-size: 3.5rem;
            color: var(--accent);
            opacity: 0.4;
            animation: pulse 3s infinite ease-in-out;
        }

        /* Portfolio Grid Section */
        .portfolio-section {
            max-width: 1200px;
            margin: 0 auto 100px;
        }

        .section-tag {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 600;
        }

        .section-title {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 12px;
        }

        .section-subtitle {
            color: var(--text-muted);
            font-size: 1.05rem;
            margin-bottom: 32px;
        }

        /* Filter Controls */
        .filter-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
        }

        .filter-tabs {
            display: flex;
            gap: 8px;
            background-color: var(--bg-card);
            padding: 6px;
            border-radius: 30px;
            border: 1px solid var(--border);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background-color: #27272a;
            color: var(--text-main);
        }

        .project-count {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 32px;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: #3f3f46;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .card-cover {
            height: 220px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid var(--border);
        }

        /* Premium Placeholder Colors */
        .c-kitschy { background: linear-gradient(145deg, #2b103c, #0d0414); }
        .c-sintonia { background: linear-gradient(145deg, #101c3c, #040814); }
        .c-orgullo { background: linear-gradient(145deg, #3c101a, #140408); }
        .c-ternura { background: linear-gradient(145deg, #103c2b, #04140d); }
        .c-rutinas { background: linear-gradient(145deg, #3c3010, #141004); }
        .c-embichado { background: linear-gradient(145deg, #22103c, #0b0414); }

        .card-cover::before {
            content: "✦";
            font-size: 2rem;
            color: var(--accent);
            opacity: 0.3;
        }

        .card-body {
            padding: 24px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.3px;
        }

        .card-category {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .card-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        /* Contact Section */
        .contact-section {
            max-width: 1200px;
            margin: 120px auto 100px;
